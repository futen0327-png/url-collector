<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>産廃施設 URL収集ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: #f0f2f5;
    color: #333;
    font-size: 14px;
    padding: 24px 16px 48px;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #1a1a2e;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 20px 24px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: #666;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 14px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    color: #444;
  }

  input[type="password"],
  input[type="text"],
  textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .2s;
    outline: none;
  }

  input[type="password"]:focus,
  input[type="text"]:focus,
  textarea:focus {
    border-color: #4a6cf7;
    box-shadow: 0 0 0 3px rgba(74,108,247,.12);
  }

  textarea {
    resize: vertical;
    min-height: 120px;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .row .field { flex: 1; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, opacity .2s;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  .btn-primary {
    background: #4a6cf7;
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: #3a5ae0; }

  .btn-secondary {
    background: #6c757d;
    color: #fff;
  }
  .btn-secondary:hover:not(:disabled) { background: #5a6268; }

  .btn-success {
    background: #28a745;
    color: #fff;
  }
  .btn-success:hover:not(:disabled) { background: #218838; }

  .btn-sm {
    padding: 6px 14px;
    font-size: 13px;
  }

  .badge-saved {
    display: inline-block;
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 10px;
    vertical-align: middle;
  }

  .field-group {
    margin-bottom: 14px;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 10px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
  }

  .progress-bar-bg {
    background: #e9ecef;
    border-radius: 6px;
    height: 12px;
    overflow: hidden;
  }

  .progress-bar-fill {
    background: linear-gradient(90deg, #4a6cf7, #6eb5ff);
    height: 100%;
    border-radius: 6px;
    transition: width .3s ease;
    width: 0%;
  }

  .current-muni {
    font-size: 13px;
    color: #555;
    margin-top: 6px;
    min-height: 18px;
  }

  .log-area {
    background: #1e1e2e;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 12px 14px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 12px;
    line-height: 1.6;
    height: 160px;
    overflow-y: auto;
    margin-top: 10px;
  }

  .log-area .log-ok   { color: #a6e3a1; }
  .log-area .log-warn { color: #f9e2af; }
  .log-area .log-err  { color: #f38ba8; }
  .log-area .log-info { color: #89b4fa; }

  /* Table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    background: #f8f9fa;
    text-align: left;
    padding: 9px 12px;
    border-bottom: 2px solid #dee2e6;
    font-weight: 700;
    color: #444;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid #f0f0f0; }
  tbody tr:hover { background: #f8f9ff; }

  tbody td {
    padding: 8px 12px;
    vertical-align: top;
    word-break: break-all;
  }

  .td-url a {
    color: #4a6cf7;
    text-decoration: none;
  }
  .td-url a:hover { text-decoration: underline; }

  .badge-hp-yes {
    display: inline-block;
    background: #d4edda;
    color: #155724;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
  }

  .badge-hp-no {
    display: inline-block;
    background: #f8d7da;
    color: #721c24;
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 700;
  }

  .source-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
    font-weight: 600;
  }
  .source-kg    { background: #cfe2ff; color: #084298; }
  .source-local { background: #d1e7dd; color: #0a3622; }
  .source-org   { background: #fff3cd; color: #664d03; }

  .no-data {
    text-align: center;
    color: #aaa;
    padding: 30px;
    font-size: 13px;
  }

  .summary-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .summary-item {
    font-size: 13px;
    color: #555;
  }

  .summary-item strong {
    color: #333;
    font-size: 16px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<h1>産廃施設 URL収集ツール</h1>

<!-- ① 設定カード -->
<div class="card">
  <div class="card-title">設定</div>
  <div class="field-group">
    <label for="apiKeyInput">SerpApi キー <span id="savedBadge" class="badge-saved" style="display:none">✓ 保存済み</span></label>
    <div class="row">
      <div class="field">
        <input type="password" id="apiKeyInput" placeholder="your_serpapi_key_here" autocomplete="off">
      </div>
      <button class="btn btn-secondary btn-sm" onclick="saveApiKey()">保存</button>
    </div>
  </div>
</div>

<!-- ② 入力カード -->
<div class="card">
  <div class="card-title">検索条件</div>
  <div class="field-group">
    <label for="muniList">市区町村リスト（1行1件）</label>
    <textarea id="muniList" placeholder="東大阪市&#10;八尾市&#10;大阪市平野区"></textarea>
  </div>
  <div class="field-group">
    <label for="queryTemplate">検索クエリテンプレート</label>
    <input type="text" id="queryTemplate" value="{市区町村} 産業廃棄物 中間処理場">
    <small style="color:#888;font-size:11px;margin-top:4px;display:block"><code>{市区町村}</code> が各市区町村名に置換されます</small>
  </div>
  <button class="btn btn-primary" id="startBtn" onclick="collectData()">▶ 収集開始</button>
</div>

<!-- ③ 進捗エリア -->
<div class="card" id="progressCard" style="display:none">
  <div class="card-title">進捗</div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">0 / 0</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="current-muni" id="currentMuni"></div>
  </div>
  <div class="log-area" id="logArea"></div>
</div>

<!-- ④ 結果テーブル -->
<div class="card" id="resultCard" style="display:none">
  <div class="card-title">収集結果</div>
  <div class="summary-bar">
    <div class="summary-item">合計 <strong id="totalCount">0</strong> 件</div>
    <div class="summary-item">HP有り <strong id="hpYesCount">0</strong> 件</div>
    <div class="summary-item">HP無し <strong id="hpNoCount">0</strong> 件</div>
  </div>
  <div class="table-wrap">
    <table id="resultTable">
      <thead>
        <tr>
          <th>No.</th>
          <th>市区町村</th>
          <th>施設名</th>
          <th>住所</th>
          <th>電話番号</th>
          <th>URL</th>
          <th>HP有無</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="7" class="no-data">収集結果がここに表示されます</td></tr>
      </tbody>
    </table>
  </div>
  <div class="btn-row">
    <button class="btn btn-success" id="downloadBtn" onclick="downloadExcel()" disabled>⬇ Excelダウンロード</button>
    <button class="btn btn-secondary btn-sm" onclick="clearResults()">結果をクリア</button>
  </div>
</div>

<script>
"use strict";

// ---- State ----
let collectedData = [];
let isRunning = false;

// ---- Init ----
(function init() {
  const saved = localStorage.getItem("sanpai_serpapi_key");
  if (saved) {
    document.getElementById("apiKeyInput").value = saved;
    document.getElementById("savedBadge").style.display = "inline-block";
  }
})();

// ---- API Key ----
function saveApiKey() {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) { alert("APIキーを入力してください"); return; }
  localStorage.setItem("sanpai_serpapi_key", val);
  document.getElementById("savedBadge").style.display = "inline-block";
}

// ---- Extract helpers ----
function extractPhone(text) {
  if (!text) return "";
  const m = text.match(/0\d{1,4}[-－‐]\d{1,4}[-－‐]\d{3,4}/);
  return m ? m[0] : "";
}

function extractAddress(text) {
  if (!text) return "";
  const m = text.match(/[^\s]{2,6}[都道府県][^\s。、]{5,25}/);
  return m ? m[0] : "";
}

// ---- Log ----
function log(msg, type = "info") {
  const area = document.getElementById("logArea");
  const ts = new Date().toLocaleTimeString("ja-JP");
  const span = document.createElement("span");
  span.className = `log-${type}`;
  span.textContent = `[${ts}] ${msg}\n`;
  area.appendChild(span);
  area.scrollTop = area.scrollHeight;
}

// ---- Progress ----
function setProgress(current, total, muni = "") {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById("progressText").textContent = `${current} / ${total}`;
  document.getElementById("progressPct").textContent = `${pct}%`;
  document.getElementById("progressBar").style.width = `${pct}%`;
  document.getElementById("currentMuni").textContent = muni ? `処理中: ${muni}` : "";
}

// ---- Add row to table ----
function addRow(entry) {
  const tbody = document.getElementById("resultBody");

  // Remove placeholder
  const placeholder = tbody.querySelector(".no-data");
  if (placeholder) placeholder.parentElement.remove();

  const tr = document.createElement("tr");
  const srcLabel = entry.source === "kg" ? '<span class="source-tag source-kg">KG</span>'
                 : entry.source === "local" ? '<span class="source-tag source-local">MAP</span>'
                 : '<span class="source-tag source-org">WEB</span>';

  const urlCell = entry.url
    ? `<a href="${escHtml(entry.url)}" target="_blank" rel="noopener">${escHtml(truncate(entry.url, 50))}</a>`
    : "—";

  tr.innerHTML = `
    <td>${escHtml(String(entry.no))}</td>
    <td>${escHtml(entry.municipality)}</td>
    <td>${escHtml(entry.facilityName)}${srcLabel}</td>
    <td>${escHtml(entry.address)}</td>
    <td>${escHtml(entry.phone)}</td>
    <td class="td-url">${urlCell}</td>
    <td>${entry.url ? '<span class="badge-hp-yes">○</span>' : '<span class="badge-hp-no">×</span>'}</td>
  `;
  tbody.appendChild(tr);

  updateSummary();
}

function updateSummary() {
  const total = collectedData.length;
  const yes = collectedData.filter(r => r.url).length;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("hpYesCount").textContent = yes;
  document.getElementById("hpNoCount").textContent = total - yes;
}

function escHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len) + "…" : str;
}

// ---- Sleep ----
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ---- SerpApi call ----
function searchSerpApi(query, apiKey) {
  return new Promise((resolve, reject) => {
    const callbackName = 'serpapi_cb_' + Date.now();
    const script = document.createElement('script');
    const params = new URLSearchParams({
      api_key: apiKey,
      engine: 'google',
      q: query,
      gl: 'jp',
      hl: 'ja',
      num: '10',
      callback: callbackName
    });
    script.src = `https://serpapi.com/search.json?${params}`;
    window[callbackName] = (data) => {
      delete window[callbackName];
      document.head.removeChild(script);
      resolve(data);
    };
    script.onerror = () => {
      delete window[callbackName];
      document.head.removeChild(script);
      reject(new Error('Failed to fetch'));
    };
    document.head.appendChild(script);
  });
}

// ---- Parse response ----
function parseResponse(municipality, data) {
  const results = [];

  // ① knowledge_graph
  const kg = data.knowledge_graph;
  if (kg && kg.title) {
    results.push({
      municipality,
      facilityName: kg.title || "",
      address: kg.address || "",
      phone: kg.phone || "",
      url: kg.website || "",
      source: "kg"
    });
  }

  // ② local_results
  const locals = data.local_results || [];
  locals.forEach(item => {
    results.push({
      municipality,
      facilityName: item.title || "",
      address: item.address || "",
      phone: item.phone || "",
      url: (item.links && item.links.website) || "",
      source: "local"
    });
  });

  // ③ organic_results
  const organics = data.organic_results || [];
  organics.forEach(item => {
    results.push({
      municipality,
      facilityName: item.title || "",
      address: extractAddress(item.snippet || ""),
      phone: extractPhone(item.snippet || ""),
      url: item.link || "",
      source: "org"
    });
  });

  return results;
}

// ---- Main ----
async function collectData() {
  if (isRunning) return;

  const apiKey = document.getElementById("apiKeyInput").value.trim();
  if (!apiKey) { alert("SerpApiキーを入力してください"); return; }

  const muniRaw = document.getElementById("muniList").value;
  const munis = muniRaw.split("\n").map(s => s.trim()).filter(Boolean);
  if (munis.length === 0) { alert("市区町村リストを入力してください"); return; }

  const template = document.getElementById("queryTemplate").value.trim() || "{市区町村} 産業廃棄物 中間処理場";

  // UI setup
  isRunning = true;
  collectedData = [];
  document.getElementById("startBtn").disabled = true;
  document.getElementById("downloadBtn").disabled = true;
  document.getElementById("resultBody").innerHTML = '<tr><td colspan="7" class="no-data">収集中…</td></tr>';
  document.getElementById("progressCard").style.display = "block";
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("logArea").innerHTML = "";
  updateSummary();
  setProgress(0, munis.length);

  log(`収集開始: ${munis.length}件の市区町村`, "info");

  for (let i = 0; i < munis.length; i++) {
    const muni = munis[i];
    setProgress(i, munis.length, muni);
    log(`[${i + 1}/${munis.length}] ${muni} 検索中…`, "info");

    const query = template.replace(/\{市区町村\}/g, muni);

    try {
      const data = await searchSerpApi(query, apiKey);
      const entries = parseResponse(muni, data);

      if (entries.length === 0) {
        log(`  → 結果なし`, "warn");
        // 結果なしでも1行追加（空レコード）
        const emptyEntry = {
          no: collectedData.length + 1,
          municipality: muni,
          facilityName: "",
          address: "",
          phone: "",
          url: "",
          source: "none"
        };
        collectedData.push(emptyEntry);
        addRow(emptyEntry);
      } else {
        log(`  → ${entries.length}件取得`, "ok");
        entries.forEach(entry => {
          entry.no = collectedData.length + 1;
          collectedData.push(entry);
          addRow(entry);
        });
      }
    } catch (err) {
      log(`  → エラー: ${err.message}`, "err");
      const errEntry = {
        no: collectedData.length + 1,
        municipality: muni,
        facilityName: `[エラー] ${err.message}`,
        address: "",
        phone: "",
        url: "",
        source: "err"
      };
      collectedData.push(errEntry);
      addRow(errEntry);
    }

    // 次の市区町村へ進む前に1秒待機（最後は不要）
    if (i < munis.length - 1) {
      await sleep(1000);
    }
  }

  setProgress(munis.length, munis.length, "");
  document.getElementById("currentMuni").textContent = "完了";
  log(`収集完了: 合計 ${collectedData.length} 件`, "ok");

  isRunning = false;
  document.getElementById("startBtn").disabled = false;
  document.getElementById("downloadBtn").disabled = false;
}

// ---- Excel Download ----
function downloadExcel() {
  if (collectedData.length === 0) { alert("ダウンロードするデータがありません"); return; }

  const headers = ["No.", "市区町村", "施設名", "住所", "電話番号", "URL", "HP有無"];
  const rows = collectedData.map((row, i) => [
    i + 1,
    row.municipality || "",
    row.facilityName || "",
    row.address || "",
    row.phone || "",
    row.url || "",
    row.url ? "○" : "×"
  ]);

  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // 列幅設定
  ws["!cols"] = [
    { wch: 6 },   // No.
    { wch: 14 },  // 市区町村
    { wch: 28 },  // 施設名
    { wch: 30 },  // 住所
    { wch: 16 },  // 電話番号
    { wch: 45 },  // URL
    { wch: 8 }    // HP有無
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "URL収集結果");

  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `URL収集_${dateStr}.xlsx`);
}

// ---- Clear ----
function clearResults() {
  if (isRunning) return;
  if (!confirm("収集結果をすべてクリアしますか？")) return;
  collectedData = [];
  document.getElementById("resultBody").innerHTML = '<tr><td colspan="7" class="no-data">収集結果がここに表示されます</td></tr>';
  document.getElementById("downloadBtn").disabled = true;
  updateSummary();
}
</script>
</body>
</html>
